services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chatsmith}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-chatsmith}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../backend/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 10

  app:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      PORT: "8080"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      PROVIDER_OPENAI_BASE_URL: ${PROVIDER_OPENAI_BASE_URL:-https://api.openai.com}
      PROVIDER_ANTHROPIC_BASE_URL: ${PROVIDER_ANTHROPIC_BASE_URL:-https://api.anthropic.com}
      DATABASE_URL: postgres://${POSTGRES_USER:-chatsmith}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-chatsmith}?sslmode=disable&connect_timeout=5
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
